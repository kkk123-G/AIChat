spring.config.activate.on-profile=prod

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${MYSQL_URL:}
spring.datasource.username=${MYSQL_USERNAME:}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3s}

app.jwt.secret=${JWT_SECRET:}
app.auth.refresh-cookie-secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.username=${INITIAL_ADMIN_USERNAME:}
app.admin.bootstrap.password=${INITIAL_ADMIN_PASSWORD:}
app.admin.bootstrap.nickname=${INITIAL_ADMIN_NICKNAME:Administrator}

spring.ai.openai.base-url=${OPENAI_BASE_URL:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.7}
spring.ai.openai.chat.timeout=${OPENAI_TIMEOUT:60s}

logging.level.root=WARN
logging.level.xyz.qvtrmx.ai=INFO
logging.file.name=${LOG_FILE:logs/backend.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_ROLLING_FILE_PATTERN:logs/backend.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}
