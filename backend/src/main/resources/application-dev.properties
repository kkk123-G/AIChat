spring.config.activate.on-profile=dev
spring.config.import=optional:classpath:application-local.properties

server.port=${SERVER_PORT:8080}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai_chat?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3s

app.jwt.secret=${JWT_SECRET:}
app.auth.refresh-cookie-secure=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.username=${INITIAL_ADMIN_USERNAME:}
app.admin.bootstrap.password=${INITIAL_ADMIN_PASSWORD:}
app.admin.bootstrap.nickname=${INITIAL_ADMIN_NICKNAME:Administrator}

spring.ai.openai.base-url=${OPENAI_BASE_URL:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.7}
spring.ai.openai.chat.timeout=${OPENAI_TIMEOUT:60s}

logging.level.xyz.qvtrmx.ai=DEBUG
